name: RepoRouter — Self Triage

on:
  issues:
    types: [opened, reopened]
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes as a catch-all
  workflow_dispatch:          # manual trigger from the Actions tab

jobs:
  triage:
    runs-on: self-hosted
    permissions:
      issues: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run triage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python triage.py ${{ github.repository }} --provider ollama --model qwen3:8b
